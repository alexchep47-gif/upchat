plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.upchat.app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.upchat.app"
        // Android 9 (API 28) is the supported compatibility floor.
        minSdk = 28
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystore = file('release-keystore.jks')
            if (keystore.exists()) {
                storeFile = keystore
                storePassword = (System.getenv('UPCHAT_KEYSTORE_PASSWORD') ?: '').trim()
                keyAlias = (System.getenv('UPCHAT_KEY_ALIAS') ?: 'upchat').trim()
                keyPassword = (System.getenv('UPCHAT_KEY_PASSWORD') ?: '').trim()
            }
        }
    }
    buildTypes {
        release {
            // Keystore fixe injectée par CI ; fallback debug uniquement pour un build local.
            signingConfig = file('release-keystore.jks').exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

// The file is supplied by GitHub Actions from the Firebase project secret.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

flutter {
    source = "../.."
}

dependencies {}
