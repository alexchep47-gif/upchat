name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Generate iOS platform files
        run: flutter create --platforms=ios --org com.upchat.app . --project-name upchat

      - name: Set Firebase-compatible iOS deployment target
        run: |
          { printf "platform :ios, '13.0'\n\n"; cat ios/Podfile; } > ios/Podfile.tmp
          mv ios/Podfile.tmp ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Inject Firebase Flutter options
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          else
            echo "FIREBASE_OPTIONS_DART_BASE64 absent — Firebase restera désactivé sans bloquer le mode hors ligne"
          fi
      - name: Configure iOS privacy descriptions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string UpChat utilise Bluetooth pour découvrir les appareils proches." ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string UpChat utilise la localisation uniquement pour la découverte de proximité." ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string UpChat utilise la caméra pour les photos de profil et les stories." ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string UpChat utilise le microphone pour les messages vocaux." ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string UpChat utilise la photothèque pour envoyer des médias." ios/Runner/Info.plist || true

      - name: Inject Firebase iOS configuration
        env:
          FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
        run: |
          if [ -n "$FIREBASE_IOS_PLIST_BASE64" ]; then
            printf '%s' "$FIREBASE_IOS_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          else
            echo "FIREBASE_IOS_PLIST_BASE64 absent — build iOS sans authentification Firebase distante"
          fi
          if [ -f ios/Runner/GoogleService-Info.plist ]; then
            python3 tooling/add_ios_plist_to_xcode.py ios/Runner.xcodeproj/project.pbxproj ios/Runner/GoogleService-Info.plist
            REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' ios/Runner/GoogleService-Info.plist 2>/dev/null || true)
            if [ -n "$REVERSED_CLIENT_ID" ]; then
              /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes array' ios/Runner/Info.plist 2>/dev/null || true
              /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0 dict' ios/Runner/Info.plist 2>/dev/null || true
              /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes array' ios/Runner/Info.plist 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED_CLIENT_ID" ios/Runner/Info.plist 2>/dev/null || true
            fi
          fi
      - name: Get dependencies
        run: flutter pub get

      - name: Generate UpChat U app icon
        run: dart run flutter_launcher_icons

      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign

      - name: Package unsigned IPA from xcarchive
        run: |
          set -e
          ARCHIVE=$(find build/ios/archive -maxdepth 1 -name '*.xcarchive' -print -quit)
          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$ARCHIVE"
          test -n "$APP"
          mkdir -p build/ios/ipa /tmp/upchat-ipa/Payload
          cp -R "$APP" /tmp/upchat-ipa/Payload/
          (cd /tmp/upchat-ipa && zip -qry "$GITHUB_WORKSPACE/build/ios/ipa/UpChat.ipa" Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: upchat-ios-unsigned-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: upchat-ios-archive
          path: build/ios/archive/*.xcarchive
          retention-days: 30
