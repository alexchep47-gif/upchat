name: Build iOS IPA (Sideloadly)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa-sideloadly:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Generate iOS platform files
        run: |
          flutter create --platforms=ios --org com.upchat --project-name upchat .
          # Bundle ID stable pour Sideloadly
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.upchat.app" ios/Runner/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.upchat.app" ios/Runner/Info.plist

      - name: iOS deployment target 13.0
        run: |
          { printf "platform :ios, '13.0'\n\n"; cat ios/Podfile; } > ios/Podfile.tmp
          mv ios/Podfile.tmp ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Inject Firebase Flutter options
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
            echo "firebase_options.dart injecté"
          else
            echo "FIREBASE_OPTIONS_DART_BASE64 absent — mode hors ligne"
          fi

      - name: Inject Firebase iOS GoogleService-Info.plist
        env:
          FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
        run: |
          if [ -n "$FIREBASE_IOS_PLIST_BASE64" ]; then
            printf '%s' "$FIREBASE_IOS_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist injecté"
            if [ -f tooling/add_ios_plist_to_xcode.py ]; then
              python3 tooling/add_ios_plist_to_xcode.py ios/Runner.xcodeproj/project.pbxproj ios/Runner/GoogleService-Info.plist || true
            fi
          else
            echo "FIREBASE_IOS_PLIST_BASE64 absent"
          fi

      - name: Privacy descriptions (Info.plist)
        run: |
          PLIST=ios/Runner/Info.plist
          add() { /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST"; }
          add NSBluetoothAlwaysUsageDescription "UpChat utilise Bluetooth pour découvrir les appareils proches."
          add NSBluetoothPeripheralUsageDescription "UpChat utilise Bluetooth pour découvrir les appareils proches."
          add NSLocationWhenInUseUsageDescription "UpChat utilise la localisation uniquement pour la découverte de proximité."
          add NSCameraUsageDescription "UpChat utilise la caméra pour les photos et stories."
          add NSMicrophoneUsageDescription "UpChat utilise le microphone pour les messages vocaux."
          add NSPhotoLibraryUsageDescription "UpChat utilise la photothèque pour envoyer des médias."

      - name: Dependencies + icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons || true

      - name: Build unsigned IPA (no-codesign) for Sideloadly
        run: |
          set -euo pipefail
          rm -rf symbols build/ios/ipa build/ios/archive /tmp/upchat-payload
          mkdir -p symbols build/ios/ipa

          # 1) Archive Flutter sans signature
          flutter build ipa --release --no-codesign --obfuscate --split-debug-info=./symbols

          # 2) Localiser le .app dans le xcarchive
          ARCHIVE=$(find build/ios/archive -maxdepth 1 -name '*.xcarchive' -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::Aucun xcarchive trouvé"
            ls -laR build/ios || true
            exit 1
          fi
          echo "Archive: $ARCHIVE"

          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::Aucun .app dans le xcarchive"
            ls -laR "$ARCHIVE/Products" || true
            exit 1
          fi
          echo "App: $APP"
          test -f "$APP/Info.plist"
          echo "Info.plist OK:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" || true

          # 3) Construire un IPA standard : Payload/Runner.app/...
          mkdir -p /tmp/upchat-payload/Payload
          # Copie complète (ditto conserve attributs macOS)
          ditto "$APP" /tmp/upchat-payload/Payload/Runner.app

          test -f /tmp/upchat-payload/Payload/Runner.app/Info.plist
          test -d /tmp/upchat-payload/Payload/Runner.app

          # 4) Zip à la racine = Payload/ (critique pour Sideloadly / IPA Installer)
          (
            cd /tmp/upchat-payload
            # -y = stocker les symlinks, -r récursif, -q quiet
            zip -qry "$GITHUB_WORKSPACE/build/ios/ipa/UpChat.ipa" Payload
          )

          echo "=== Contenu de UpChat.ipa ==="
          unzip -l "$GITHUB_WORKSPACE/build/ios/ipa/UpChat.ipa" | head -40

          # 5) Validations strictes
          unzip -l "$GITHUB_WORKSPACE/build/ios/ipa/UpChat.ipa" | grep -q 'Payload/Runner.app/Info.plist'
          unzip -l "$GITHUB_WORKSPACE/build/ios/ipa/UpChat.ipa" | grep -q 'Payload/Runner.app/'

          # Vérifie qu'on n'a PAS zippé un dossier parent parasite
          BAD=$(unzip -l "$GITHUB_WORKSPACE/build/ios/ipa/UpChat.ipa" | awk '{print $4}' | grep -v '^Payload' | grep -v '^----' | grep -v 'Name' | grep -v '^$' | head -5 || true)
          if [ -n "$BAD" ]; then
            echo "::warning::Entrées hors Payload (peut être normal pour commentaires zip): $BAD"
          fi

          SIZE=$(stat -f%z "$GITHUB_WORKSPACE/build/ios/ipa/UpChat.ipa")
          echo "Taille IPA: $SIZE octets"
          if [ "$SIZE" -lt 15000000 ]; then
            echo "::warning::IPA < 15 Mo — possible app incomplète (Flutter release fait souvent 20–60 Mo)"
          fi

          # Extraire Info.plist pour preuve dans les logs
          unzip -p "$GITHUB_WORKSPACE/build/ios/ipa/UpChat.ipa" Payload/Runner.app/Info.plist > /tmp/Info.plist
          echo "Bundle ID:" $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /tmp/Info.plist)
          echo "Executable:" $(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' /tmp/Info.plist)
          echo "Version:" $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /tmp/Info.plist)

          du -h "$GITHUB_WORKSPACE/build/ios/ipa/UpChat.ipa"
          echo "IPA Sideloadly prêt: build/ios/ipa/UpChat.ipa"

      - name: Upload Sideloadly IPA
        uses: actions/upload-artifact@v4
        with:
          name: upchat-sideloadly-ipa
          path: build/ios/ipa/UpChat.ipa
          retention-days: 30

      - name: Upload debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upchat-ios-symbols
          path: symbols/
          retention-days: 14
          if-no-files-found: ignore
