name: Generate UpChat signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.UPCHAT_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.UPCHAT_KEY_ALIAS || secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.UPCHAT_KEY_PASSWORD || secrets.KEY_PASSWORD }}
    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Ajoute d’abord KEYSTORE_PASSWORD et KEY_ALIAS (ou leurs variantes UPCHAT_*) dans GitHub Secrets."
            exit 1
          fi

      - name: Generate a fixed private signing keystore
        run: |
          set -euo pipefail
          EFFECTIVE_KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          keytool -genkeypair \
            -keystore upchat-release.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$EFFECTIVE_KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=UpChat, OU=Mobile, O=UpChat, L=Yaounde, ST=Centre, C=CM"
          echo "Empreintes à copier dans Firebase > Project settings > Your apps > Android:"
          keytool -list -v \
            -keystore upchat-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            2>/dev/null | grep -E 'Alias name:|SHA1:|SHA256:'

      - name: Upload private keystore for one day
        uses: actions/upload-artifact@v5
        with:
          name: upchat-release-keystore-private
          path: upchat-release.jks
          retention-days: 1
          if-no-files-found: error
