name: Build Android and Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate UpChat U app icon
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Ensure Android platform files
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android . --project-name upchat
          fi

      - name: Build APK (arm64)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: upchat-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure Web platform files
        run: |
          if [ ! -f web/index.html ] || [ ! -f web/manifest.json ]; then
            flutter create --platforms=web . --project-name upchat
          fi

      - name: Build Flutter Web for Vercel (/app/)
        run: |
          flutter build web --release --base-href "/app/"
          BUILD_ID="${{ github.sha }}"
          echo "$BUILD_ID" > build/web/.last_build_id
          if [ -f build/web/index.html ]; then
            sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${BUILD_ID}|g" build/web/index.html
            sed -i "s|flutter.js|flutter.js?v=${BUILD_ID}|g" build/web/index.html
          fi

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: upchat-web
          path: build/web
          retention-days: 30

      - name: Deploy to upchat-web /app (Vercel)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT absent — skip deploy Vercel"
            exit 0
          fi
          BUILD_ID="${{ github.sha }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/upchat-web
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/alexchep47-gif/upchat-web.git" /tmp/upchat-web
          rm -rf /tmp/upchat-web/app
          mkdir -p /tmp/upchat-web/app
          cp -a build/web/. /tmp/upchat-web/app/
          echo "$BUILD_ID" > /tmp/upchat-web/.last_build_id
          echo "$BUILD_ID" > /tmp/upchat-web/app/.last_build_id
          echo "$BUILD_ID" > /tmp/upchat-web/.upchat-source-sha
          date -u +"%Y-%m-%dT%H:%M:%SZ" > /tmp/upchat-web/app/.deployed_at
          cat > /tmp/upchat-web/vercel.json << EOF
          {
            "cleanUrls": false,
            "trailingSlash": true,
            "rewrites": [
              { "source": "/", "destination": "/app/index.html" },
              { "source": "/app", "destination": "/app/index.html" },
              { "source": "/app/", "destination": "/app/index.html" }
            ],
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  { "key": "Cache-Control", "value": "public, max-age=0, must-revalidate" }
                ]
              }
            ]
          }
          EOF
          if [ ! -f /tmp/upchat-web/index.html ] || ! grep -q "upchat\|UpChat" /tmp/upchat-web/index.html 2>/dev/null; then
            cat > /tmp/upchat-web/index.html << EOF
          <!DOCTYPE html><html><head>
          <meta http-equiv="refresh" content="0; url=/app/?v=${BUILD_ID}" />
          <script>location.replace('/app/?v=${BUILD_ID}');</script>
          </head><body><a href="/app/?v=${BUILD_ID}">UpChat</a></body></html>
          EOF
          fi
          cd /tmp/upchat-web
          git add -A
          VER=$(grep '^version:' "$GITHUB_WORKSPACE/pubspec.yaml" | head -1 | awk '{print $2}')
          git commit -m "Deploy UpChat ${VER} ${BUILD_ID}" || echo "Nothing to commit"
          git push origin main

      - name: Build Flutter Web for GitHub Pages (/upchat/)
        run: |
          flutter build web --release --base-href "/upchat/" -o build/web-pages
          BUILD_ID="${{ github.sha }}"
          echo "$BUILD_ID" > build/web-pages/.last_build_id
          date -u +"%Y-%m-%dT%H:%M:%SZ" > build/web-pages/.deployed_at
          if [ -f build/web-pages/index.html ]; then
            sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${BUILD_ID}|g" build/web-pages/index.html
            sed -i "s|flutter.js|flutter.js?v=${BUILD_ID}|g" build/web-pages/index.html
            sed -i 's|</head>|<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>\n</head>|' build/web-pages/index.html
          fi
          echo "$BUILD_ID" > build/web-pages/.last_build_id

      - name: Deploy to GitHub Pages (branche gh-pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BUILD_ID="${{ github.sha }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/upchat-pages
          mkdir -p /tmp/upchat-pages
          cp -a build/web-pages/. /tmp/upchat-pages/
          echo "$BUILD_ID" > /tmp/upchat-pages/.last_build_id
          cd /tmp/upchat-pages
          git init
          git checkout -b gh-pages
          cat > index.html << EOF
          <!DOCTYPE html><html><head>
          <meta http-equiv="refresh" content="0; url=/upchat/?v=${BUILD_ID}" />
          <script>location.replace('/upchat/?v=${BUILD_ID}');</script>
          </head><body><a href="/upchat/?v=${BUILD_ID}">UpChat</a></body></html>
          EOF
          git add -A
          git commit -m "GitHub Pages UpChat ${{ github.sha }}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/alexchep47-gif/upchat.git"
          git push -f origin gh-pages
          echo "Publié sur https://alexchep47-gif.github.io/upchat/?v=${BUILD_ID}"
