name: Build Android and Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure Android platform files
        run: |
          flutter create --platforms=android,web . --project-name upchat || true
          git checkout -- android/app/src/main/AndroidManifest.xml || true
          git checkout -- android/app/build.gradle || true
          git checkout -- android/build.gradle || true
          git checkout -- android/settings.gradle || true
          git checkout -- android/app/src/main/kotlin/com/upchat/app/MainActivity.kt || true

      - name: Build APK (arm64)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: upchat-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  build-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure Web platform files
        run: |
          flutter create --platforms=web . --project-name upchat || true

      - name: Build web app
        run: flutter build web --release

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: upchat-web
          path: build/web
          retention-days: 30
