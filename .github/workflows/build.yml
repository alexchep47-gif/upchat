name: Build Android and Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Inject Firebase Flutter options
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          else
            echo "FIREBASE_OPTIONS_DART_BASE64 absent — Firebase restera désactivé sans bloquer le mode hors ligne"
          fi

      - name: Inject Android Firebase configuration and fixed keystore
        env:
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_JSON_BASE64 }}
          UPCHAT_KEYSTORE_BASE64: ${{ secrets.UPCHAT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_JSON_BASE64" ]; then
            printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "FIREBASE_ANDROID_JSON_BASE64 absent — build Android sans authentification Firebase distante"
          fi
          if [ -n "$UPCHAT_KEYSTORE_BASE64" ]; then
            printf '%s' "$UPCHAT_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            echo "Keystore release injectée ($(wc -c < android/app/release-keystore.jks) octets)"
          else
            echo "UPCHAT_KEYSTORE_BASE64 absent — signature debug de secours"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Validate Android release keystore
        env:
          UPCHAT_KEYSTORE_PASSWORD: ${{ secrets.UPCHAT_KEYSTORE_PASSWORD }}
          UPCHAT_KEY_ALIAS: ${{ secrets.UPCHAT_KEY_ALIAS }}
          UPCHAT_KEY_PASSWORD: ${{ secrets.UPCHAT_KEY_PASSWORD }}
        run: |
          if [ -f android/app/release-keystore.jks ]; then
            STORE_PASSWORD=$(printf '%s' "$UPCHAT_KEYSTORE_PASSWORD" | tr -d '\r\n')
            KEY_PASSWORD=$(printf '%s' "${UPCHAT_KEY_PASSWORD:-$STORE_PASSWORD}" | tr -d '\r\n')
            KEY_ALIAS=$(printf '%s' "${UPCHAT_KEY_ALIAS:-upchat}" | tr -d '\r\n')
            if keytool -list -keystore android/app/release-keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              if keytool -list -keystore android/app/release-keystore.jks -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
                keytool -importkeystore -noprompt \
                  -srckeystore android/app/release-keystore.jks -srcstoretype PKCS12 \
                  -srcstorepass "$STORE_PASSWORD" -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" \
                  -destkeystore android/app/release-keystore.jks.tmp -deststoretype JKS \
                  -deststorepass "$STORE_PASSWORD" -destalias "$KEY_ALIAS" -destkeypass "$KEY_PASSWORD"
                mv android/app/release-keystore.jks.tmp android/app/release-keystore.jks
                echo "Keystore PKCS12 convertie en JKS"
              fi
              echo "Release keystore valide — APK sera signé en production (alias=$KEY_ALIAS)"
              keytool -list -v -keystore android/app/release-keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep -E 'Alias name:|SHA1:|SHA256:' || true
            else
              echo "::warning::Keystore release invalide ou mot de passe incorrect — repli sur signature debug"
              rm -f android/app/release-keystore.jks
            fi
          else
            echo "Signature debug de secours — aucune keystore release injectée"
          fi

      - name: Generate UpChat U app icon
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml || true

      - name: Ensure Android platform files
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android . --project-name upchat
          fi

      - name: Build universal APK (Android 9+) — signed release
        env:
          UPCHAT_KEYSTORE_PASSWORD: ${{ secrets.UPCHAT_KEYSTORE_PASSWORD }}
          UPCHAT_KEY_ALIAS: ${{ secrets.UPCHAT_KEY_ALIAS }}
          UPCHAT_KEY_PASSWORD: ${{ secrets.UPCHAT_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build APKs by ABI — signed release
        env:
          UPCHAT_KEYSTORE_PASSWORD: ${{ secrets.UPCHAT_KEYSTORE_PASSWORD }}
          UPCHAT_KEY_ALIAS: ${{ secrets.UPCHAT_KEY_ALIAS }}
          UPCHAT_KEY_PASSWORD: ${{ secrets.UPCHAT_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Verify APK signatures
        run: |
          for apk in build/app/outputs/flutter-apk/app-*.apk; do
            [ -f "$apk" ] || continue
            echo "=== $(basename "$apk") ==="
            (ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 | xargs -I{} {} verify --print-certs "$apk") \
              || (unzip -p "$apk" 'META-INF/*.RSA' 2>/dev/null | keytool -printcert 2>/dev/null) \
              || echo "APK: $(ls -lh "$apk")"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: upchat-apk
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30

      - name: Upload universal APK for the website job
        uses: actions/upload-artifact@v4
        with:
          name: upchat-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-web:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Inject Firebase Flutter options (web)
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure Web platform files
        run: |
          if [ ! -f web/index.html ] || [ ! -f web/manifest.json ]; then
            flutter create --platforms=web . --project-name upchat
          fi

      - name: Build Flutter Web for Vercel (/app/)
        run: |
          flutter build web --release --base-href "/app/"
          BUILD_ID="${{ github.sha }}"
          echo "$BUILD_ID" > build/web/.last_build_id
          date -u +"%Y-%m-%dT%H:%M:%SZ" > build/web/.deployed_at
          if [ -f build/web/index.html ]; then
            sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${BUILD_ID}|g" build/web/index.html
            sed -i "s|flutter.js|flutter.js?v=${BUILD_ID}|g" build/web/index.html
            sed -i "s|main.dart.js|main.dart.js?v=${BUILD_ID}|g" build/web/index.html
          fi

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: upchat-web
          path: build/web
          retention-days: 30

      - name: Download universal APK for the website
        uses: actions/download-artifact@v4
        with:
          name: upchat-apk-universal
          path: build/universal

      - name: Deploy to upchat-web /app (Vercel)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT absent — skip deploy Vercel"
            exit 0
          fi
          BUILD_ID="${{ github.sha }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/upchat-web
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/alexchep47-gif/upchat-web.git" /tmp/upchat-web
          rm -rf /tmp/upchat-web/app
          mkdir -p /tmp/upchat-web/app
          cp -a build/web/. /tmp/upchat-web/app/
          mkdir -p /tmp/upchat-web/downloads
          cp build/universal/app-release.apk /tmp/upchat-web/downloads/UpChat-universal.apk
          VER=$(grep '^version:' "$GITHUB_WORKSPACE/pubspec.yaml" | head -1 | awk '{print $2}' | tr '+' '-')
          cp build/universal/app-release.apk "/tmp/upchat-web/downloads/UpChat-${VER}-universal.apk"
          echo "$BUILD_ID" > /tmp/upchat-web/.last_build_id
          echo "$BUILD_ID" > /tmp/upchat-web/app/.last_build_id
          cd /tmp/upchat-web
          git add -A
          git commit -m "Deploy UpChat web ${BUILD_ID}" || echo "Nothing to commit"
          git push origin main

      - name: Build + force-publish GitHub Pages (latest web)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BUILD_ID="${{ github.sha }}"
          flutter build web --release --base-href "/upchat/" -o build/web-pages
          echo "$BUILD_ID" > build/web-pages/.last_build_id
          date -u +"%Y-%m-%dT%H:%M:%SZ" > build/web-pages/.deployed_at
          if [ -f build/web-pages/index.html ]; then
            sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${BUILD_ID}|g" build/web-pages/index.html
            sed -i "s|flutter.js|flutter.js?v=${BUILD_ID}|g" build/web-pages/index.html
            sed -i "s|main.dart.js|main.dart.js?v=${BUILD_ID}|g" build/web-pages/index.html
            # anti-cache navigateur
            if ! grep -q 'no-cache' build/web-pages/index.html; then
              sed -i 's|</head>|<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>\n<meta http-equiv="Pragma" content="no-cache"/>\n</head>|' build/web-pages/index.html
            fi
          fi
          rm -rf /tmp/upchat-pages && mkdir -p /tmp/upchat-pages/downloads
          cp -a build/web-pages/. /tmp/upchat-pages/
          cp build/universal/app-release.apk /tmp/upchat-pages/downloads/UpChat-universal.apk
          VER=$(grep '^version:' "$GITHUB_WORKSPACE/pubspec.yaml" | head -1 | awk '{print $2}' | tr '+' '-')
          cp build/universal/app-release.apk "/tmp/upchat-pages/downloads/UpChat-${VER}-universal.apk"
          cd /tmp/upchat-pages
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "GitHub Pages UpChat ${BUILD_ID} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/alexchep47-gif/upchat.git"
          git push -f origin gh-pages
          echo "Pages branch updated: https://alexchep47-gif.github.io/upchat/?v=${BUILD_ID}"

      - name: Trigger official Pages deployment job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/alexchep47-gif/upchat/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}' || true

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON absent"
            exit 0
          fi
          flutter build web --release --base-href "/" -o build/web-firebase
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13 deploy --only hosting --project upchat-android --non-interactive
