name: Build Android and Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Inject Firebase Flutter options
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          else
            echo "FIREBASE_OPTIONS_DART_BASE64 absent — Firebase restera désactivé sans bloquer le mode hors ligne"
          fi
      - name: Inject Android Firebase configuration and fixed keystore
        env:
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_JSON_BASE64 }}
          UPCHAT_KEYSTORE_BASE64: ${{ secrets.UPCHAT_KEYSTORE_BASE64 }}
          UPCHAT_KEYSTORE_PASSWORD: ${{ secrets.UPCHAT_KEYSTORE_PASSWORD }}
          UPCHAT_KEY_ALIAS: ${{ secrets.UPCHAT_KEY_ALIAS }}
          UPCHAT_KEY_PASSWORD: ${{ secrets.UPCHAT_KEY_PASSWORD }}
        run: |
          if [ -n "$FIREBASE_ANDROID_JSON_BASE64" ]; then
            printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "FIREBASE_ANDROID_JSON_BASE64 absent — build Android sans authentification Firebase distante"
          fi
          if [ -n "$UPCHAT_KEYSTORE_BASE64" ]; then
            printf '%s' "$UPCHAT_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          else
            echo "UPCHAT_KEYSTORE_BASE64 absent — signature debug de secours"
          fi
      - name: Get dependencies
        run: flutter pub get

      - name: Generate UpChat U app icon
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Ensure Android platform files
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android . --project-name upchat
          fi

      - name: Build universal APK (Android 9+)
        run: flutter build apk --release

      - name: Build APKs by ABI
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: upchat-apk
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30
      - name: Upload universal APK for the website job
        uses: actions/upload-artifact@v4
        with:
          name: upchat-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-web:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure Web platform files
        run: |
          if [ ! -f web/index.html ] || [ ! -f web/manifest.json ]; then
            flutter create --platforms=web . --project-name upchat
          fi

      - name: Build Flutter Web for Vercel (/app/)
        run: |
          flutter build web --release --base-href "/app/"
          BUILD_ID="${{ github.sha }}"
          echo "$BUILD_ID" > build/web/.last_build_id
          if [ -f build/web/index.html ]; then
            sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${BUILD_ID}|g" build/web/index.html
            sed -i "s|flutter.js|flutter.js?v=${BUILD_ID}|g" build/web/index.html
          fi

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: upchat-web
          path: build/web
          retention-days: 30

      - name: Download universal APK for the website
        uses: actions/download-artifact@v4
        with:
          name: upchat-apk-universal
          path: build/universal

      - name: Deploy to upchat-web /app (Vercel)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT absent — skip deploy Vercel"
            exit 0
          fi
          BUILD_ID="${{ github.sha }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/upchat-web
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/alexchep47-gif/upchat-web.git" /tmp/upchat-web
          rm -rf /tmp/upchat-web/app
          mkdir -p /tmp/upchat-web/app
          cp -a build/web/. /tmp/upchat-web/app/
          mkdir -p /tmp/upchat-web/downloads
          cp build/universal/app-release.apk /tmp/upchat-web/downloads/UpChat-universal.apk
          VER=$(grep '^version:' "$GITHUB_WORKSPACE/pubspec.yaml" | head -1 | awk '{print $2}' | tr '+' '-')
          cp build/universal/app-release.apk "/tmp/upchat-web/downloads/UpChat-${VER}-universal.apk"
          printf '%s\n' "$BUILD_ID" > /tmp/upchat-web/downloads/UpChat-universal.apk.sha
          sha256sum build/universal/app-release.apk | awk '{print $1}' > "/tmp/upchat-web/downloads/UpChat-${VER}-universal.apk.sha256"
          echo "$BUILD_ID" > /tmp/upchat-web/.last_build_id
          echo "$BUILD_ID" > /tmp/upchat-web/app/.last_build_id
          echo "$BUILD_ID" > /tmp/upchat-web/.upchat-source-sha
          date -u +"%Y-%m-%dT%H:%M:%SZ" > /tmp/upchat-web/app/.deployed_at
          cat > /tmp/upchat-web/vercel.json << EOF
          {
            "cleanUrls": false,
            "trailingSlash": true,
            "rewrites": [
              { "source": "/app", "destination": "/app/index.html" },
              { "source": "/app/", "destination": "/app/index.html" }
            ],
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  { "key": "Cache-Control", "value": "public, max-age=0, must-revalidate" }
                ]
              }
            ]
          }
          EOF
          if [ ! -f /tmp/upchat-web/index.html ] || ! grep -q "upchat\|UpChat" /tmp/upchat-web/index.html 2>/dev/null; then
            cat > /tmp/upchat-web/index.html << EOF
          <!DOCTYPE html><html><head>
          <meta http-equiv="refresh" content="0; url=/app/?v=${BUILD_ID}" />
          <script>location.replace('/app/?v=${BUILD_ID}');</script>
          </head><body><a href="/app/?v=${BUILD_ID}">UpChat</a></body></html>
          EOF
          fi
          cd /tmp/upchat-web
          git add -A
          VER=$(grep '^version:' "$GITHUB_WORKSPACE/pubspec.yaml" | head -1 | awk '{print $2}')
          git commit -m "Deploy UpChat ${VER} ${BUILD_ID}" || echo "Nothing to commit"
          git push origin main

      - name: Build Flutter Web for GitHub Pages (/upchat/)
        run: |
          flutter build web --release --base-href "/upchat/" -o build/web-pages
          BUILD_ID="${{ github.sha }}"
          echo "$BUILD_ID" > build/web-pages/.last_build_id
          date -u +"%Y-%m-%dT%H:%M:%SZ" > build/web-pages/.deployed_at
          if [ -f build/web-pages/index.html ]; then
            sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${BUILD_ID}|g" build/web-pages/index.html
            sed -i "s|flutter.js|flutter.js?v=${BUILD_ID}|g" build/web-pages/index.html
            sed -i 's|</head>|<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>\n</head>|' build/web-pages/index.html
          fi
          echo "$BUILD_ID" > build/web-pages/.last_build_id

      - name: Deploy to GitHub Pages (branche gh-pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BUILD_ID="${{ github.sha }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/upchat-pages
          mkdir -p /tmp/upchat-pages
          cp -a build/web-pages/. /tmp/upchat-pages/
          mkdir -p /tmp/upchat-pages/downloads
          cp build/universal/app-release.apk /tmp/upchat-pages/downloads/UpChat-universal.apk
          VER=$(grep '^version:' "$GITHUB_WORKSPACE/pubspec.yaml" | head -1 | awk '{print $2}' | tr '+' '-')
          cp build/universal/app-release.apk "/tmp/upchat-pages/downloads/UpChat-${VER}-universal.apk"
          sha256sum build/universal/app-release.apk | awk '{print $1 "  UpChat-universal.apk"}' > /tmp/upchat-pages/downloads/UpChat-universal.apk.sha256
          sha256sum build/universal/app-release.apk | awk -v f="UpChat-${VER}-universal.apk" '{print $1 "  " f}' > "/tmp/upchat-pages/downloads/UpChat-${VER}-universal.apk.sha256"
          echo "$BUILD_ID" > /tmp/upchat-pages/.last_build_id
          cd /tmp/upchat-pages
          git init
          git checkout -b gh-pages
          git add -A
          git commit -m "GitHub Pages UpChat ${{ github.sha }}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/alexchep47-gif/upchat.git"
          git push -f origin gh-pages
          echo "Publié sur https://alexchep47-gif.github.io/upchat/?v=${BUILD_ID}"
      - name: Trigger GitHub Pages deployment
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT absent — la branche gh-pages est à jour, mais la publication Pages devra être déclenchée manuellement"
            exit 0
          fi
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            https://api.github.com/repos/alexchep47-gif/upchat/actions/workflows/deploy-pages.yml/dispatches \
            -d '{"ref":"main"}'
