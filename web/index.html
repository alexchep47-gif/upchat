<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="UpChat — messagerie P2P offline + mode internet par numéro.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UpChat">
  <meta name="theme-color" content="#128C7E">
  <link rel="apple-touch-icon" href="icons/upchat-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/upchat-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/upchat-192.png">

  <title>UpChat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { color-scheme: dark; background: #0f141b; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #0f141b;
      overflow: hidden;
    }
    #upchat-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 38%, rgba(42, 171, 238, .16), transparent 28%),
        linear-gradient(145deg, #0b1118 0%, #111c25 52%, #17232b 100%);
      opacity: 1;
      visibility: visible;
      transition: opacity .28s ease, visibility .28s ease;
    }
    #upchat-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .upchat-loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      transform: translateY(-5vh);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .upchat-loading-logo {
      width: 92px;
      height: 92px;
      padding: 13px;
      box-sizing: border-box;
      border-radius: 28px;
      background: linear-gradient(145deg, #2aabee, #128c7e);
      box-shadow: 0 18px 45px rgba(0, 0, 0, .32), 0 0 0 1px rgba(255, 255, 255, .12);
      object-fit: contain;
    }
    .upchat-loading-title {
      color: #f7fbff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -.4px;
    }
    .upchat-loading-subtitle {
      margin-top: -10px;
      color: rgba(230, 240, 248, .64);
      font-size: 13px;
    }
    .upchat-loading-dots { display: flex; gap: 7px; margin-top: 4px; }
    .upchat-loading-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2aabee;
      animation: upchat-pulse 1.1s infinite ease-in-out;
    }
    .upchat-loading-dots span:nth-child(2) { animation-delay: .14s; }
    .upchat-loading-dots span:nth-child(3) { animation-delay: .28s; }
    @keyframes upchat-pulse {
      0%, 70%, 100% { opacity: .28; transform: scale(.78); }
      35% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="upchat-loading" role="status" aria-label="Chargement d’UpChat">
    <div class="upchat-loading-card">
      <img class="upchat-loading-logo" src="icons/upchat-32.png" alt="UpChat">
      <div class="upchat-loading-title">UpChat</div>
      <div class="upchat-loading-subtitle">Messagerie privée, partout</div>
      <div class="upchat-loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      var loader = document.getElementById('upchat-loading');
      var hide = function () { if (loader) loader.classList.add('is-hidden'); };
      window.addEventListener('flutter-first-frame', hide, { once: true });
      window.setTimeout(hide, 15000);
    })();
  </script>
</body>
</html>
