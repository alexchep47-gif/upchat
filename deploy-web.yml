# À placer dans le dépôt upchat-web : .github/workflows/deploy-web.yml
name: Déployer UpChat web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Préparer le projet web
        run: |
          if [ ! -d web ]; then
            flutter create . --platforms web --project-name upchat
          fi
          flutter --version

      - run: flutter pub get

      - name: Compiler le web
        run: |
          BUILD_ID="${GITHUB_SHA::12}"
          flutter build web --release --base-href /upchat-web/
          if [ -f build/web/index.html ]; then
            sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${BUILD_ID}|g" build/web/index.html || true
            sed -i "s|flutter.js|flutter.js?v=${BUILD_ID}|g" build/web/index.html || true
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
