name: upchat
description: UpChat — Messagerie P2P 100% offline (Bluetooth + WiFi Direct).
publish_to: 'none'
version: 1.3.1+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Stockage local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Authentification distante facultative (le mode hors ligne reste autonome)
  firebase_core: 2.32.0
  firebase_auth: 4.20.0
  google_sign_in: 6.2.1
  sign_in_with_apple: ^6.1.4

  # P2P Nearby Connections (Bluetooth + WiFi Direct)
  nearby_connections: ^4.1.1

  # Réseau (mode internet / signalisation)
  http: ^1.2.2

  # Médias
  image_picker: ^1.1.2
  video_player: ^2.9.2
  path: ^1.9.0

  # Permissions & utilitaires
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  intl: ^0.19.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/upchat_u_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/upchat_u_icon.png
  adaptive_icon_background: '#128C7E'
  adaptive_icon_foreground: assets/upchat_u_icon.png
  remove_alpha_ios: true
